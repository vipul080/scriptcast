name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Render the example video
        run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: examples/dashboard/demo.mp4

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scriptcast
        uses: ./
        with:
          script: test/fixtures/served.yml
          args: --gif
          start: python3 -m http.server 8080 --directory examples/todo
          wait-on: http://localhost:8080/index.html
      - name: Check the Action produced a video and a GIF
        run: |
          test -s "${{ steps.scriptcast.outputs.video }}"
          test -s "${{ steps.scriptcast.outputs.gif }}"
          ls -la "${{ steps.scriptcast.outputs.video }}" "${{ steps.scriptcast.outputs.gif }}"
